naftiko: 1.0.0-alpha2
info:
  label: Synapse Admin API — Media
  description: 'Synapse Admin API — Media. 1 operations. Lead operation: Get User Media Statistics. Self-contained Naftiko
    capability covering one Synapse business surface.'
  tags:
  - Synapse
  - Media
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SYNAPSE_API_KEY: SYNAPSE_API_KEY
capability:
  consumes:
  - type: http
    namespace: admin-media
    baseUri: https://matrix.example.com/_synapse/admin
    description: Synapse Admin API — Media business capability. Self-contained, no shared references.
    resources:
    - name: v1-statistics-users-media
      path: /v1/statistics/users/media
      operations:
      - name: getusermediastatistics
        method: GET
        description: Get User Media Statistics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
        - name: from
          in: query
          type: integer
        - name: order_by
          in: query
          type: string
    authentication:
      type: bearer
      token: '{{env.SYNAPSE_API_KEY}}'
  exposes:
  - type: rest
    namespace: admin-media-rest
    port: 8080
    description: REST adapter for Synapse Admin API — Media. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v1/statistics/users/media
      name: v1-statistics-users-media
      description: REST surface for v1-statistics-users-media.
      operations:
      - method: GET
        name: getusermediastatistics
        description: Get User Media Statistics
        call: admin-media.getusermediastatistics
        with:
          limit: rest.limit
          from: rest.from
          order_by: rest.order_by
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: admin-media-mcp
    port: 9090
    transport: http
    description: MCP adapter for Synapse Admin API — Media. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-user-media-statistics
      description: Get User Media Statistics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-media.getusermediastatistics
      with:
        limit: tools.limit
        from: tools.from
        order_by: tools.order_by
      outputParameters:
      - type: object
        mapping: $.
