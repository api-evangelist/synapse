naftiko: 1.0.0-alpha2
info:
  label: Synapse Admin API — Server
  description: 'Synapse Admin API — Server. 2 operations. Lead operation: Get Background Updates Status. Self-contained Naftiko
    capability covering one Synapse business surface.'
  tags:
  - Synapse
  - Server
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SYNAPSE_API_KEY: SYNAPSE_API_KEY
capability:
  consumes:
  - type: http
    namespace: admin-server
    baseUri: https://matrix.example.com/_synapse/admin
    description: Synapse Admin API — Server business capability. Self-contained, no shared references.
    resources:
    - name: v1-background_updates-enabled
      path: /v1/background_updates/enabled
      operations:
      - name: getbackgroundupdatesenabled
        method: GET
        description: Get Background Updates Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-server_version
      path: /v1/server_version
      operations:
      - name: getserverversion
        method: GET
        description: Get Server Version
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SYNAPSE_API_KEY}}'
  exposes:
  - type: rest
    namespace: admin-server-rest
    port: 8080
    description: REST adapter for Synapse Admin API — Server. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v1/background-updates/enabled
      name: v1-background-updates-enabled
      description: REST surface for v1-background_updates-enabled.
      operations:
      - method: GET
        name: getbackgroundupdatesenabled
        description: Get Background Updates Status
        call: admin-server.getbackgroundupdatesenabled
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/server-version
      name: v1-server-version
      description: REST surface for v1-server_version.
      operations:
      - method: GET
        name: getserverversion
        description: Get Server Version
        call: admin-server.getserverversion
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: admin-server-mcp
    port: 9090
    transport: http
    description: MCP adapter for Synapse Admin API — Server. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-background-updates-status
      description: Get Background Updates Status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-server.getbackgroundupdatesenabled
      outputParameters:
      - type: object
        mapping: $.
    - name: get-server-version
      description: Get Server Version
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-server.getserverversion
      outputParameters:
      - type: object
        mapping: $.
