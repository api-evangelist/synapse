naftiko: "1.0.0-alpha1"

info:
  label: Synapse Admin API
  description: >-
    The Synapse Admin API provides server administrators with management
    capabilities for users, rooms, media, federation, registration tokens,
    and server statistics on a Matrix homeserver.
  tags:
    - Administration
    - Matrix
    - Synapse
    - Users
    - Rooms
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      SYNAPSE_ADMIN_TOKEN: SYNAPSE_ADMIN_TOKEN

capability:
  consumes:
    - type: http
      namespace: synapse-admin
      baseUri: https://matrix.example.com/_synapse/admin
      description: Synapse Admin API for homeserver management
      authentication:
        type: bearer
        token: "{{SYNAPSE_ADMIN_TOKEN}}"
      resources:
        - name: users
          path: /v2/users
          description: User account management
          operations:
            - name: list-users
              method: GET
              description: List all local users on the homeserver
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: Maximum results to return
                - name: from
                  in: query
                  type: integer
                  required: false
                  description: Pagination offset
                - name: deactivated
                  in: query
                  type: boolean
                  required: false
                  description: Include deactivated accounts
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-user
              method: GET
              description: Get details about a specific user
              inputParameters:
                - name: userId
                  in: path
                  type: string
                  required: true
                  description: Matrix user ID
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: upsert-user
              method: PUT
              description: Create or modify a user account
              inputParameters:
                - name: userId
                  in: path
                  type: string
                  required: true
                  description: Matrix user ID
              body:
                type: json
                data:
                  password: "{{tools.password}}"
                  admin: "{{tools.admin}}"
                  displayname: "{{tools.displayname}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: rooms
          path: /v1/rooms
          description: Room administration
          operations:
            - name: list-rooms
              method: GET
              description: List all rooms on the homeserver
              inputParameters:
                - name: search_term
                  in: query
                  type: string
                  required: false
                  description: Filter by room name or ID
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: Maximum results
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-room
              method: GET
              description: Get details about a specific room
              inputParameters:
                - name: roomId
                  in: path
                  type: string
                  required: true
                  description: Matrix room ID
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-room-members
              method: GET
              description: List all members of a room
              inputParameters:
                - name: roomId
                  in: path
                  type: string
                  required: true
                  description: Matrix room ID
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: registration-tokens
          path: /v1/registration_tokens
          description: Registration token management
          operations:
            - name: list-registration-tokens
              method: GET
              description: List all registration tokens
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-registration-token
              method: POST
              description: Create a new registration token
              body:
                type: json
                data:
                  uses_allowed: "{{tools.usesAllowed}}"
                  expiry_time: "{{tools.expiryTime}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: server
          path: /v1/server_version
          description: Server information
          operations:
            - name: get-server-version
              method: GET
              description: Get the current Synapse server version
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: synapse-admin-rest
      resources:
        - path: /v1/users
          name: users
          description: User management
          operations:
            - method: GET
              name: list-users
              description: List all users
              call: "synapse-admin.list-users"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/rooms
          name: rooms
          description: Room management
          operations:
            - method: GET
              name: list-rooms
              description: List all rooms
              call: "synapse-admin.list-rooms"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/registration-tokens
          name: registration-tokens
          description: Registration token management
          operations:
            - method: GET
              name: list-tokens
              description: List registration tokens
              call: "synapse-admin.list-registration-tokens"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-token
              description: Create registration token
              call: "synapse-admin.create-registration-token"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/server
          name: server
          description: Server information
          operations:
            - method: GET
              name: get-version
              description: Get server version
              call: "synapse-admin.get-server-version"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: synapse-admin-mcp
      transport: http
      tools:
        - name: list-users
          description: List all local users on the Synapse homeserver
          hints:
            readOnly: true
            openWorld: false
          call: "synapse-admin.list-users"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-user
          description: Get details about a specific Matrix user
          hints:
            readOnly: true
            openWorld: false
          call: "synapse-admin.get-user"
          with:
            userId: "tools.userId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-rooms
          description: List all rooms on the Synapse homeserver
          hints:
            readOnly: true
            openWorld: false
          call: "synapse-admin.list-rooms"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-room-members
          description: Get all members of a Matrix room
          hints:
            readOnly: true
            openWorld: false
          call: "synapse-admin.get-room-members"
          with:
            roomId: "tools.roomId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-registration-token
          description: Create a new registration token for controlled user sign-up
          hints:
            readOnly: false
            destructive: false
          call: "synapse-admin.create-registration-token"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-server-version
          description: Get the current Synapse homeserver version
          hints:
            readOnly: true
            openWorld: false
          call: "synapse-admin.get-server-version"
          outputParameters:
            - type: object
              mapping: "$."
