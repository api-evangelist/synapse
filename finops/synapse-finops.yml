  ServiceName: Synapse Matrix Homeserver
  ServiceCategory: Open-Source Messaging Infrastructure
  ProviderName: Element / matrix-org
  PublisherName: Element (New Vector Ltd.)
  BillingCurrency: USD
meters:
  - name: monthly_active_users
    description: MAUs on the homeserver - the most useful unit for sizing compute and database load.
    unit: user
    aggregation: max
    dimensions:
      - server
  - name: federation_traffic
    description: Bytes exchanged over federation; drives egress and database growth on busy public rooms.
    unit: GB
    aggregation: sum
    dimensions:
      - server
      - peer
  - name: media_storage
    description: Media repository storage (uploads, thumbnails) - persistent storage cost.
    unit: GB-month
    aggregation: max
    dimensions:
      - server
  - name: postgres_storage
    description: Postgres-backing database growth - the dominant operator cost on large deployments.
    unit: GB-month
    aggregation: max
    dimensions:
      - server
  - name: room_event_volume
    description: Persisted room events; drives database write IO and disk consumption.
    unit: event
    aggregation: sum
    dimensions:
      - server
      - room
principles:
  - name: Visibility
    description: Synapse exposes Prometheus metrics and an Admin API that surface MAUs, federation traffic, room-event rates, and media storage; pair these with the cloud bill to attribute Synapse-driven cost.
  - name: Allocation
    description: Operators allocate against the homeserver they run; multi-tenant operators can use room-level / appservice-level metrics to apportion infra cost to internal customers.
  - name: Optimization
    description: Tune `ratelimiting` defaults, enable workers to scale federation independently, prune old media, archive old room state, and scope federation reachability to control egress.
  - name: Accountability
    description: The platform team running the Matrix homeserver owns Synapse cost; Element is the commercial counterparty only if ESS is purchased.
