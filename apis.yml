  name: Synapse Application Service API
  description: >-
    API for integrating application services (bridges and bots) with the Matrix homeserver. Allows third-party
    applications to handle namespaced user IDs and room aliases, enabling Matrix bridges for IRC, Slack,
    Telegram, and other platforms.
