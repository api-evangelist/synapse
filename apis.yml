aid: synapse
name: Synapse
description: >-
  Synapse is the reference Matrix homeserver implementation maintained by Element (formerly by the Matrix.org
  Foundation). Written in Python and Rust, it implements the Matrix open standard for secure, decentralized real-time
  communication. Synapse powers thousands of deployments worldwide and provides Client-Server, Server-Server
  (federation), Application Service, Identity Service, and Admin APIs. Since version 1.99, maintained by Element under
  AGPL-3.0.
